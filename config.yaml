# E-Ink Hub Configuration
# Environment variables can be referenced with ${VAR_NAME} syntax

display:
  width: 800
  height: 480
  driver: epd7in5_V2
  mock_mode: false  # Set true for development without hardware

logging:
  level: INFO
  file: logs/eink-hub.log

schedule:
  mode: auto_rotate  # manual | auto_rotate | photo_slideshow
  rotation_interval_minutes: 5
  layout_sequence:
    - composite_hub
    - larry_board
    - strava_dashboard
    - daily_rundown
    - week_view
    - weather_view
    - local_weather
    - photo_frame
  quiet_hours:
    start: "22:00"
    end: "07:00"
  # Photo slideshow settings (for photo_slideshow mode)
  photo_interval_minutes: 5
  photo_fit_mode: fit  # fit (letterbox) | fill (crop)
  photo_rotation: 0    # 0, 90, 180, 270

providers:
  strava:
    enabled: true
    refresh_interval_minutes: 15
    credentials:
      client_id: ${STRAVA_CLIENT_ID}
      client_secret: ${STRAVA_CLIENT_SECRET}
      refresh_token: ${STRAVA_REFRESH_TOKEN}

  weather:
    enabled: true
    refresh_interval_minutes: 30
    credentials:
      api_key: ${OPENWEATHER_API_KEY}
    options:
      location: "Charleston,US"
      units: imperial  # imperial | metric

  calendar:
    enabled: true
    refresh_interval_minutes: 15
    options:
      ical_url: ${CALENDAR_ICAL_URL}

  indoor_sensor:
    enabled: true
    refresh_interval_minutes: 2
    options:
      database: sensors.db
      stats_hours: 24
      history_hours: 6  # Hours of history for graphs

  message_board:
    enabled: true
    refresh_interval_minutes: 1
    options: {}

layouts:
  composite_hub:
    name: "Info Hub"
    widgets:
      - type: clock
        x: 20
        y: 15
        width: 280
        height: 70
        options:
          format: "12h"
          show_day: true

      - type: weather
        x: 540
        y: 15
        width: 240
        height: 100
        provider: weather
        options:
          compact: false

      - type: calendar
        x: 20
        y: 110
        width: 380
        height: 280
        provider: calendar
        options:
          max_events: 6
          show_time: true

      - type: strava_compact
        x: 420
        y: 130
        width: 360
        height: 240
        provider: strava

      - type: indoor_sensor
        x: 20
        y: 400
        width: 180
        height: 70
        provider: indoor_sensor
        options:
          compact: true
          title: "Outside"

      - type: message_board_compact
        x: 220
        y: 415
        width: 560
        height: 50
        provider: message_board
        options:
          font_size: 18

  strava_dashboard:
    name: "Strava Weekly"
    widgets:
      - type: text
        x: 0
        y: 18
        width: 800
        height: 50
        options:
          text: "Strava Weekly"
          font_size: 40
          bold: true
          center: true

      - type: strava_compact
        x: 40
        y: 100
        width: 320
        height: 180
        provider: strava

      - type: strava_chart
        x: 400
        y: 100
        width: 360
        height: 320
        provider: strava

  daily_rundown:
    name: "Daily Rundown"
    widgets:
      - type: clock
        x: 30
        y: 20
        width: 300
        height: 100
        options:
          format: "12h"
          show_day: true

      - type: weather
        x: 500
        y: 20
        width: 280
        height: 120
        provider: weather

      - type: calendar
        x: 30
        y: 150
        width: 740
        height: 300
        provider: calendar
        options:
          max_events: 8
          show_time: true

  week_view:
    name: "Week View"
    widgets:
      - type: calendar_week
        x: 0
        y: 0
        width: 800
        height: 480
        provider: calendar
        options:
          start_hour: 7
          end_hour: 21
          show_current_time: true

  weather_view:
    name: "Weather"
    widgets:
      - type: weather_full
        x: 0
        y: 0
        width: 800
        height: 480
        provider: weather
        options:
          show_hourly: true
          show_daily: true
          show_details: true

  local_weather:
    name: "Local Weather"
    widgets:
      - type: indoor_sensor
        x: 0
        y: 0
        width: 800
        height: 480
        provider: indoor_sensor
        options:
          layout_mode: dashboard
          title: "Outside My Window - Charleston, SC"
          use_fahrenheit: true

  photo_frame:
    name: "Photo Frame"
    widgets:
      - type: photo_frame
        x: 0
        y: 0
        width: 800
        height: 480
        options:
          fit_mode: fit
          rotation: 0
          show_filename: false

  larry_board:
    name: "Larry's Board"
    widgets:
      - type: message_board
        x: 20
        y: 20
        width: 760
        height: 340
        provider: message_board
        options:
          title: "🦔 Larry Says"
          font_size: 26
          max_lines: 8
          show_timestamp: true
          show_category: true

      - type: clock
        x: 20
        y: 380
        width: 200
        height: 80
        options:
          format: "12h"
          show_day: true

      - type: weather
        x: 540
        y: 380
        width: 240
        height: 80
        provider: weather
        options:
          compact: true
